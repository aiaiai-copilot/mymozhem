services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mymozhem
      POSTGRES_PASSWORD: mymozhem
      POSTGRES_DB: mymozhem
    # No host port mapping by design: the server reaches postgres over the internal
    # compose network, so publishing 5432 on the host is unnecessary and would collide
    # with any local Postgres. Add a mapping ad-hoc if you need an external DB client.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymozhem"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build: .
    environment:
      DATABASE_URL: postgresql://mymozhem:mymozhem@postgres:5432/mymozhem?schema=public
      # REQ-SEC-002: обязателен, >=32 байта; без значения в окружении compose не стартует.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>=32 bytes)}
      # REQ-SEC-008: allowlist origin через запятую; пусто = CORS-заголовки не выдаются.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # REQ-ID-006: доверие X-Forwarded-For — свойство деплоя (за reverse-proxy = true).
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # OAuth-шов e2e-smoke (Task 16): dummy-креды Google. Start-эндпоинт только
      # строит authorize-URL (обращения к Google нет), но без all-or-none тройки
      # (superRefine в config.schema) /auth/google отвечал бы 503
      # OAUTH_NOT_CONFIGURED и smoke не смог бы проверить 302-шов env↔UI.
      # На боевой деплой эти значения не годятся — callback с ними не пройдёт.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-e2e-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-e2e-dummy-client-secret}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:3000/auth/google/callback}
      # REQ-ID-009: allowlist redirect'ов — exact match (z.array(z.url()));
      # лендинг после OAuth шлёт ровно ${origin}/host.
      OAUTH_REDIRECT_ALLOWLIST: ${OAUTH_REDIRECT_ALLOWLIST:-http://localhost:3000/host}
      # UI-срез (дизайн §2): same-origin раздача собранного SPA из того же образа
      # (build-стейдж Dockerfile собирает apps/web турбо-таской в /app/apps/web/dist).
      WEB_STATIC_DIR: /app/apps/web/dist
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
