services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mymozhem
      POSTGRES_PASSWORD: mymozhem
      POSTGRES_DB: mymozhem
    # No host port mapping by design: the server reaches postgres over the internal
    # compose network, so publishing 5432 on the host is unnecessary and would collide
    # with any local Postgres. Add a mapping ad-hoc if you need an external DB client.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymozhem"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build: .
    environment:
      DATABASE_URL: postgresql://mymozhem:mymozhem@postgres:5432/mymozhem?schema=public
      # REQ-SEC-002: обязателен, >=32 байта; без значения в окружении compose не стартует.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (>=32 bytes)}
      # REQ-SEC-008: allowlist origin через запятую; пусто = CORS-заголовки не выдаются.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # REQ-ID-006: доверие X-Forwarded-For — свойство деплоя (за reverse-proxy = true).
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
