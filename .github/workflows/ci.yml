name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
        env:
          # CI-only placeholder so prisma.config.ts's env('DATABASE_URL') resolves
          # during config loading. `prisma generate` does not connect to a DB;
          # mirrors the same placeholder used in the Dockerfile build stage.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run test:int
        env:
          # Testcontainers spins up its own ephemeral Postgres via Docker; this is a
          # placeholder so prisma.config.ts's env('DATABASE_URL') resolves during CLI
          # config loading. The harness overrides DATABASE_URL with the live container
          # URL before `migrate deploy` (see postgres.testcontainer.ts).
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      - run: pnpm run build
      - run: pnpm run boundary-check
      - run: pnpm run guardrails

  # e2e-smoke UI-среза (Task 16): Playwright против ЛОКАЛЬНОГО compose-стенда,
  # собранного из этого же чекаута. Никогда не против production — baseURL
  # зашит в e2e/playwright.config.ts, а стенд живёт только внутри раннера.
  e2e-web:
    runs-on: ubuntu-latest
    needs: build
    env:
      # Фиктивный тестовый секрет (REQ-SEC-002 требует >=32 байта): стенд
      # эфемерен и не покидает раннер. Job-level, потому что compose-CLI
      # интерполирует окружение файла в каждом шаге (up/exec/down), а compose
      # помечает JWT_SECRET как обязательный (:? — fail-closed).
      JWT_SECRET: ci-e2e-dummy-jwt-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # node_modules нужны только для @playwright/test и запуска теста;
      # сам стенд собирается docker'ом из исходников чекаута.
      - run: pnpm install --frozen-lockfile
      - name: Поднять compose-стенд (postgres + server с SPA)
        run: docker compose up -d --build
      - name: Дождаться живости сервера
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health/live > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "server did not become live" >&2
          docker compose logs server
          exit 1
      # Бинарь playwright живёт только в apps/web (devDependency @mymozhem/web);
      # из корня workspace `pnpm exec playwright` его не видит — без --filter
      # шаг падает с "Command not found".
      - run: pnpm --filter @mymozhem/web exec playwright install --with-deps chromium
      - name: Seed REGISTERED-сессии организатора
        run: |
          TOKEN=$(docker compose exec -T server node apps/server/scripts/e2e-web-seed.mjs --email=e2e@example.com | jq -r .refreshToken)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "E2E_REFRESH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - run: pnpm --filter @mymozhem/web test:e2e
      - name: Погасить стенд
        if: always()
        run: docker compose down -v
